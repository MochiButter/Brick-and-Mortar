import groovy.json.JsonBuilder
import groovy.json.JsonSlurper

plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }

    // EMI
    modImplementation "dev.emi:emi-fabric:${emi_version}"

    // Cloth Config
    modImplementation "me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}"
    modImplementation "com.terraformersmc:modmenu:${mod_menu_version}"

    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    implementation group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.1'
    implementation project(":common")
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }

    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

fabricApi {
    configureDataGeneration {
        client = true
        outputDirectory = project(":common").file("src/generated/resources")
    }
}

tasks.named("runDatagen") {
    doLast {
        println "Post-processing datagen files for Multiloader conditions..."

        def dataDir = project(":common").file("src/generated/resources/data/brick_and_mortar")

        def compatMap = [
                'ash': 'supplementaries',
                'resin': 'vanillabackport'
        ]

        if (dataDir.exists()) {
            fileTree(dir: dataDir, include: '**/*.json').each { File file ->
                def content = file.text
                def json = new JsonSlurper().parseText(content)
                def modified = false
                def fileName = file.name
                def lootTable = file.path.contains("loot_tables")

                compatMap.each { keyword, modid ->
                    if (fileName.contains(keyword)) {
                        if (json["fabric:load_conditions"] == null) {
                            json["fabric:load_conditions"] = [["condition": "fabric:all_mods_loaded", "values": []]]
                        }

                        def allMods = json["fabric:load_conditions"].find { it.condition == "fabric:all_mods_loaded" }
                        if (allMods != null && !allMods.values.contains(modid)) {
                            allMods.values.add(modid)
                            modified = true
                        }
                    }
                }

                if (!lootTable && json["fabric:load_conditions"] != null) {
                    def forgeConds = []

                    json["fabric:load_conditions"].each { fCond ->
                        if (fCond.condition == "fabric:all_mods_loaded") {
                            fCond.values.each { modid ->
                                forgeConds.add([
                                        "type": "forge:mod_loaded",
                                        "modid": modid
                                ])
                            }
                        }
                    }

                    if (!forgeConds.isEmpty() && json["conditions"] != forgeConds) {
                        json["conditions"] = forgeConds
                        modified = true
                    }
                }

                if (modified) {
                    file.text = new JsonBuilder(json).toPrettyString()
                    println " -> Injected load conditions into: ${file.name}"
                }
            }
        }
    }
}

publishMods {
    file = tasks.named("remapJar").flatMap { it.archiveFile }
}